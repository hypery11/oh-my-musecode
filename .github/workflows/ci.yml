name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile hooks
        run: python3 -m py_compile hooks/*.py
      - name: Check CLI
        run: node --check bin/omm.mjs
      - name: Manifest sanity
        run: python3 scripts/check-manifest.py
      - name: Keyword hook
        run: python3 tests/test_prompt_keywords.py
