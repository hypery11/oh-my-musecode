name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile hooks
        run: python3 -m py_compile hooks/*.py
      - name: Check CLI
        run: |
          node --check bin/omm.mjs
          node --check bin/lib/fs.mjs
          node --check bin/lib/skills.mjs
          node --check bin/lib/engines.mjs
      - name: Manifest sanity
        run: python3 scripts/check-manifest.py
      - name: Keyword hook
        run: python3 tests/test_prompt_keywords.py
      - name: Cwd resolution
        run: python3 tests/test_cwd.py
      - name: CLI engines
        run: python3 tests/test_cli.py
      - name: Stop chain
        run: python3 tests/test_stop_chain.py
      - name: Extra hooks
        run: python3 tests/test_hooks_extra.py
