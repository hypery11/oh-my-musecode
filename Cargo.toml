[workspace]
resolver = "2"
members = [
    "crates/omm-host",
    "crates/omm-ledger",
    "crates/omm-manifest",
    "crates/omm-doctor",
    "crates/omm",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.88"
repository = "https://github.com/hypery11/oh-my-musecode"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# `preserve_order` keeps the user's key order in settings.json / trust.json so a
# targeted merge produces a minimal diff (Muse re-serialises the file anyway).
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
walkdir = "2"
time = { version = "0.3", features = ["formatting", "macros"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
